<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Slides</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="toolbar">
    <h1>Markdown Slides</h1>
    <div class="toolbar-right">
      <span id="status"></span>
      <button id="saveBtn">Save (Ctrl+S)</button>
    </div>
  </header>

  <main class="workspace">
    <section class="pane editor-pane">
      <textarea id="editor" spellcheck="false" placeholder="Write your markdown here..."></textarea>
    </section>

    <section class="pane preview-pane">
      <div id="slide" class="slide"></div>
      <div class="controls">
        <button id="prevBtn">&larr; Left</button>
        <span id="counter"></span>
        <button id="nextBtn">Right &rarr;</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
